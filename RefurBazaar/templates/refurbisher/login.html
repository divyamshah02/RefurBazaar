{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Refurbisher Portal - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="{% static 'css/style.css' %}" rel="stylesheet">
    
    <style>
        /* Minimal login-specific styles only */
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--gradient-primary);
            padding: 2rem 1rem;
            position: relative;
            overflow: hidden;
        }

        .login-container::before {
            content: "";
            position: absolute;
            top: -50%;
            right: -50%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 0%, transparent 70%);
            animation: float 20s ease-in-out infinite;
        }

        .login-card {
            background: white;
            border-radius: 20px;
            padding: 3rem 2.5rem;
            box-shadow: var(--shadow-2xl);
            max-width: 450px;
            width: 100%;
            position: relative;
            z-index: 1;
            animation: slideUp 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .login-logo {
            width: 64px;
            height: 64px;
            background: var(--gradient-primary);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            box-shadow: var(--shadow-md);
        }

        .login-logo i {
            font-size: 2rem;
            color: white;
        }

        .login-title {
            font-size: 1.875rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 0.5rem;
            letter-spacing: -0.025em;
        }

        .login-subtitle {
            color: var(--text-light);
            font-size: 0.95rem;
        }

        .form-label {
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
            display: block;
        }

        .phone-input-group {
            position: relative;
            margin-bottom: 1.5rem;
        }

        .phone-prefix {
            position: absolute;
            left: 1rem;
            top: 72%;
            transform: translateY(-50%);
            color: var(--text-light);
            font-weight: 600;
            z-index: 1;
            font-size: 1rem;
        }

        .phone-input {
            padding-left: 3.5rem !important;
        }

        .otp-container {
            display: none;
        }

        .otp-container.active {
            display: block;
            animation: fadeInUp 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-light);
            text-decoration: none;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .back-button:hover {
            color: var(--primary-color);
            transform: translateX(-4px);
        }

        .otp-header {
            text-align: center;
            margin-bottom: 2rem;
            padding: 1.25rem;
            background: var(--bg-light);
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .otp-header p {
            margin: 0;
        }

        .otp-header .text-muted {
            font-size: 0.875rem;
            margin-bottom: 0.5rem;
            color: var(--text-light);
        }

        .otp-header .phone-display {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--primary-color);
            letter-spacing: 0.5px;
        }

        .otp-inputs {
            display: flex;
            gap: 0.75rem;
            justify-content: center;
            margin: 2rem 0;
        }

        .otp-input {
            width: 3.5rem;
            height: 3.5rem;
            text-align: center;
            font-size: 1.5rem;
            font-weight: 600;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            background: white;
            color: var(--text-dark);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .otp-input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(107, 176, 68, 0.1);
            transform: scale(1.05);
        }

        .otp-input.filled {
            background: rgba(107, 176, 68, 0.05);
            border-color: var(--primary-color);
        }

        .resend-otp {
            text-align: center;
            margin-top: 1.5rem;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .resend-link {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .resend-link:hover {
            color: var(--primary-dark);
            text-decoration: underline;
        }

        .resend-link.disabled {
            color: var(--text-muted);
            cursor: not-allowed;
            pointer-events: none;
        }

        .error-message {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #dc2626;
            padding: 0.875rem 1rem;
            border-radius: 12px;
            margin-bottom: 1rem;
            font-size: 0.875rem;
            display: none;
            animation: fadeInUp 0.3s ease;
        }

        .error-message.show {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .error-message i {
            font-size: 1rem;
        }

        .success-message {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            color: #16a34a;
            padding: 0.875rem 1rem;
            border-radius: 12px;
            margin-bottom: 1rem;
            font-size: 0.875rem;
            display: none;
            animation: fadeInUp 0.3s ease;
        }

        .success-message.show {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .success-message i {
            font-size: 1rem;
        }

        .loader {
            display: inline-block;
            width: 1rem;
            height: 1rem;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .btn-loading {
            position: relative;
            pointer-events: none;
        }

        .btn-loading .btn-text {
            opacity: 0;
        }

        .btn-loading .loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        @media (max-width: 576px) {
            .login-card {
                padding: 2rem 1.5rem;
            }

            .login-title {
                font-size: 1.5rem;
            }

            .otp-input {
                width: 2.75rem;
                height: 2.75rem;
                font-size: 1.25rem;
            }

            .otp-inputs {
                gap: 0.5rem;
            }
        }

        .security-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        .security-badge i {
            color: var(--success-color);
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="login-logo">
                    <i class="fas fa-recycle"></i>
                </div>
                <h1 class="login-title">Refurbisher Portal</h1>
                <p class="login-subtitle">Sign in to manage your business</p>
            </div>

            <div id="errorMessage" class="error-message">
                <i class="fas fa-exclamation-circle"></i>
                <span id="errorText"></span>
            </div>
            <div id="successMessage" class="success-message">
                <i class="fas fa-check-circle"></i>
                <span id="successText"></span>
            </div>

            <div id="phoneSection">
                <form id="phoneForm">
                    <div class="phone-input-group">
                        <label class="form-label">Mobile Number</label>
                        <span class="phone-prefix">+91</span>
                        <input 
                            type="tel" 
                            class="form-control phone-input" 
                            id="mobileNumber" 
                            placeholder="Enter your mobile number"
                            maxlength="10"
                            pattern="[0-9]{10}"
                            required
                        >
                    </div>
                    <button type="submit" class="btn btn-primary w-100" id="sendOtpBtn">
                        <span class="btn-text">Send OTP</span>
                    </button>
                </form>
            </div>

            <div id="otpSection" class="otp-container">
                <a href="#" class="back-button" id="backToPhone">
                    <i class="fas fa-arrow-left"></i>
                    Change Number
                </a>
                
                <div class="otp-header">
                    <p class="text-muted">Enter the 6-digit OTP sent to</p>
                    <p class="phone-display" id="displayMobile"></p>
                </div>

                <form id="otpForm">
                    <div class="otp-inputs">
                        <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric" data-index="0">
                        <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric" data-index="1">
                        <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric" data-index="2">
                        <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric" data-index="3">
                        <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric" data-index="4">
                        <input type="text" class="otp-input" maxlength="1" pattern="[0-9]" inputmode="numeric" data-index="5">
                    </div>

                    <button type="submit" class="btn btn-primary w-100" id="verifyOtpBtn">
                        <span class="btn-text">Verify OTP</span>
                    </button>
                </form>

                <div class="resend-otp">
                    Didn't receive OTP? 
                    <a class="resend-link" id="resendOtpLink">Resend OTP</a>
                    <span id="resendTimer" style="display: none;"> in <span id="timerCount">30</span>s</span>
                </div>
            </div>

            <div class="security-badge">
                <i class="fas fa-shield-alt"></i>
                <span>Secure Login with OTP Verification</span>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/api_caller.js' %}"></script>
    <script src="{% static 'js/refurbisher/login.js' %}"></script>

    <script>
        window.onload = async function () {
            await initLogin("{% url 'otp-api-list' %}", "{{csrf_token}}")
        }
    </script>
</body>
</html>
