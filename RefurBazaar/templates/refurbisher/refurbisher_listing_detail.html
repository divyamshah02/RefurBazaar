<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listing Details - RefurBazar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
    <link href="/static/css/refurbisher/refurbisher_dash.css" rel="stylesheet">
</head>

<body>
    <nav class="navbar navbar-expand-lg main-navbar" id="navbar">
        <div class="container-fluid px-4">
            <a class="navbar-brand me-auto" href="index.html">
                <i class="fas fa-recycle me-2"></i>RefurBazar
            </a>

            <div class="d-flex align-items-center ms-auto">
                <a href="refurbisher_listings.html" class="btn btn-outline-primary me-3">
                    <i class="fas fa-arrow-left me-2"></i>Back to Listings
                </a>
                <div class="dropdown">
                    <a href="#" class="btn btn-primary dropdown-toggle" data-bs-toggle="dropdown">
                        <i class="fas fa-user me-2"></i><span id="user-name">Loading...</span>
                    </a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="refurbisher_profile.html">Profile</a></li>
                        <li><a class="dropdown-item" href="#">Settings</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item" href="#">Logout</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <div class="dashboard-container">
        <div class="container-fluid">
            <div class="row">
                <div class="col-12">
                    <div class="dashboard-main">
                        <!-- Listing Header -->
                        <div class="dashboard-card" id="listing-header">
                            <div class="skeleton-loader">
                                <div class="skeleton-text" style="width: 60%; height: 30px;"></div>
                                <div class="skeleton-text" style="width: 40%; height: 20px; margin-top: 10px;"></div>
                            </div>
                        </div>

                        <!-- Listing Stats -->
                        <div class="dashboard-stats" id="listing-stats">
                            <div class="stat-card skeleton-loader">
                                <div class="skeleton-icon"></div>
                                <div class="skeleton-text"></div>
                                <div class="skeleton-text"></div>
                            </div>
                            <div class="stat-card skeleton-loader">
                                <div class="skeleton-icon"></div>
                                <div class="skeleton-text"></div>
                                <div class="skeleton-text"></div>
                            </div>
                            <div class="stat-card skeleton-loader">
                                <div class="skeleton-icon"></div>
                                <div class="skeleton-text"></div>
                                <div class="skeleton-text"></div>
                            </div>
                            <div class="stat-card skeleton-loader">
                                <div class="skeleton-icon"></div>
                                <div class="skeleton-text"></div>
                                <div class="skeleton-text"></div>
                            </div>
                        </div>

                        <!-- Listing Details -->
                        <div class="row">
                            <div class="col-lg-4">
                                <div class="dashboard-card" id="listing-info">
                                    <h5 class="mb-3">Listing Information</h5>
                                    <div class="skeleton-loader">
                                        <div class="skeleton-text"></div>
                                        <div class="skeleton-text"></div>
                                        <div class="skeleton-text"></div>
                                        <div class="skeleton-text"></div>
                                    </div>
                                </div>
                            </div>

                            <div class="col-lg-8">
                                <div class="dashboard-card">
                                    <div class="d-flex justify-content-between align-items-center mb-3">
                                        <h5 class="mb-0">Units</h5>
                                        <div>
                                            <button class="btn btn-sm btn-outline-primary" id="add-unit-btn">
                                                <i class="fas fa-plus me-1"></i>Add Unit
                                            </button>
                                        </div>
                                    </div>
                                    <div class="table-responsive">
                                        <table class="table dashboard-table">
                                            <thead>
                                                <tr>
                                                    <th>Unit #</th>
                                                    <th>Attributes</th>
                                                    <th>Price</th>
                                                    <th>Status</th>
                                                    <th>Actions</th>
                                                </tr>
                                            </thead>
                                            <tbody id="units-table-body">
                                                <tr class="skeleton-loader">
                                                    <td><div class="skeleton-text"></div></td>
                                                    <td><div class="skeleton-text"></div></td>
                                                    <td><div class="skeleton-text"></div></td>
                                                    <td><div class="skeleton-text"></div></td>
                                                    <td><div class="skeleton-text"></div></td>
                                                </tr>
                                            </tbody>
                                        </table>
                                    </div>
                                    <div id="units-empty-state" class="text-center py-4" style="display: none;">
                                        <i class="fas fa-box-open fa-2x text-muted mb-2"></i>
                                        <p class="text-muted">No units added yet</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Unit Modal -->
    <div class="modal fade" id="addUnitModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Add New Unit</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="add-unit-form">
                        <div class="mb-3">
                            <label class="form-label">Price</label>
                            <input type="number" class="form-control" id="unit-price" required>
                        </div>
                        <div id="unit-attributes-container">
                            <!-- Dynamic attribute fields will be added here -->
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="save-unit-btn">Save Unit</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/api_caller.js"></script>
    <script src="/static/js/refurbisher/refurbisher_listing_detail.js"></script>

    <script>
        // Initialize the listing detail page with API endpoints
        document.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const listingId = urlParams.get('id');
            
            if (!listingId) {
                alert('Invalid listing ID');
                window.location.href = 'refurbisher_listings.html';
                return;
            }
            
            const apiUrls = {
                listings: "{% url 'listings-list' %}",
                productModelAttributes: "{% url 'product-model-attributes-list' %}",
                userDetail: "{% url 'user-detail-api-list' %}"
            };
            const csrfToken = "{{ csrf_token }}";
            
            initListingDetail(listingId, apiUrls, csrfToken);
        });
    </script>
</body>

</html>
