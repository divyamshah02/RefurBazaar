{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listing Details - RefurBazar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
    <link href="/static/css/refurbisher/refurbisher_dash.css" rel="stylesheet">
</head>

<body>
    {% include 'refurbisher/nav.html' %}
    <div class="dashboard-container">
        <div class="container-fluid">
            <div class="row">
                <!-- Added left sidebar navigation -->
                <div class="col-lg-3 col-md-4">
                    {% include 'refurbisher/menu.html' %}
                </div>

                <div class="col-lg-9 col-md-8">
                    <div class="dashboard-main">
                        <!-- Updated header with better status visibility and removed activate button -->
                        <div class="dashboard-header mb-4">
                            <div class="d-flex justify-content-between align-items-start">
                                <div>
                                    <div class="d-flex align-items-center gap-3 mb-2">
                                        <h2 class="mb-0" id="listing-title">Loading...</h2>
                                        <span id="listing-status-badge"></span>
                                    </div>
                                    <p class="text-muted mb-0" id="listing-subtitle">Loading...</p>
                                </div>
                                <div class="d-flex gap-2">
                                    <a href="/refurbisher-listings/" class="btn btn-outline-secondary">
                                        <i class="fas fa-arrow-left me-1"></i>Back
                                    </a>
                                    <button class="btn btn-outline-danger" onclick="deleteListing()">
                                        <i class="fas fa-trash me-1"></i>Delete
                                    </button>
                                </div>
                            </div>
                        </div>

                        <!-- Listing Header -->
                        <!-- <div class="dashboard-card" id="listing-header">
                            <div class="skeleton-loader">
                                <div class="skeleton-text" style="width: 60%; height: 30px;"></div>
                                <div class="skeleton-text" style="width: 40%; height: 20px; margin-top: 10px;"></div>
                            </div>
                        </div> -->
                        <!-- Listing Stats -->
                        <div class="dashboard-stats" id="listing-stats">
                            <div class="stat-card skeleton-loader">
                                <div class="skeleton-icon"></div>
                                <div class="skeleton-text"></div>
                                <div class="skeleton-text"></div>
                            </div>
                            <div class="stat-card skeleton-loader">
                                <div class="skeleton-icon"></div>
                                <div class="skeleton-text"></div>
                                <div class="skeleton-text"></div>
                            </div>
                            <div class="stat-card skeleton-loader">
                                <div class="skeleton-icon"></div>
                                <div class="skeleton-text"></div>
                                <div class="skeleton-text"></div>
                            </div>
                            <div class="stat-card skeleton-loader">
                                <div class="skeleton-icon"></div>
                                <div class="skeleton-text"></div>
                                <div class="skeleton-text"></div>
                            </div>
                        </div>

                        <!-- Listing Details -->
                        <div class="row">
                            <div class="col-lg-4" style="display: none;">
                                <div class="dashboard-card" id="listing-info">
                                    <h5 class="mb-3">Listing Information</h5>
                                    <div class="skeleton-loader">
                                        <div class="skeleton-text"></div>
                                        <div class="skeleton-text"></div>
                                        <div class="skeleton-text"></div>
                                        <div class="skeleton-text"></div>
                                    </div>
                                </div>
                            </div>

                            <div class="col-lg-12">
                                <div class="dashboard-card">
                                    <div class="d-flex justify-content-between align-items-center mb-3">
                                        <h5 class="mb-0">Units</h5>
                                        <div>
                                            <button class="btn btn-sm btn-primary" id="add-unit-btn">
                                                <i class="fas fa-plus me-1"></i>Add Unit
                                            </button>
                                        </div>
                                    </div>
                                    <div class="table-responsive">
                                        <table class="table dashboard-table">
                                            <thead>
                                                <tr>
                                                    <th>Unit #</th>
                                                    <th>Attributes</th>
                                                    <th>Condition</th>
                                                    <th>Price</th>
                                                    <th>Status</th>
                                                    <th>Actions</th>
                                                </tr>
                                            </thead>
                                            <tbody id="units-table-body">
                                                <tr class="skeleton-loader">
                                                    <td><div class="skeleton-text"></div></td>
                                                    <td><div class="skeleton-text"></div></td>
                                                    <td><div class="skeleton-text"></div></td>
                                                    <td><div class="skeleton-text"></div></td>
                                                    <td><div class="skeleton-text"></div></td>
                                                    <td><div class="skeleton-text"></div></td>
                                                </tr>
                                            </tbody>
                                        </table>
                                    </div>
                                    <div id="units-empty-state" class="text-center py-4" style="display: none;">
                                        <i class="fas fa-box-open fa-2x text-muted mb-2"></i>
                                        <p class="text-muted">No units added yet</p>
                                    </div>
                                </div>
                            </div>
                        </div>

                        
                        <div class="dashboard-card" id="listing-info">
                            <h5 class="mb-3">Listing Information</h5>
                            <div class="skeleton-loader">
                                <div class="skeleton-text"></div>
                                <div class="skeleton-text"></div>
                                <div class="skeleton-text"></div>
                                <div class="skeleton-text"></div>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Updated modal to support both add and edit modes -->
    <div class="modal fade" id="unitModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="unitModalTitle">Add New Unit</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="unit-form">
                        <div class="mb-3">
                            <label class="form-label">Condition *</label>
                            <select class="form-select" id="unit-condition" required>
                                <option value="">Select Condition</option>
                                <option value="excellent">Excellent</option>
                                <option value="good">Good</option>
                                <option value="fair">Fair</option>
                                <option value="poor">Poor</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Price *</label>
                            <input type="number" class="form-control" id="unit-price" required>
                        </div>
                        <div id="unit-attributes-container">
                            <!-- Dynamic attribute fields will be added here -->
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="save-unit-btn">Save Unit</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/api_caller.js"></script>
    <script src="/static/js/refurbisher/refurbisher_listing_detail.js"></script>

    <script>
        // Initialize the listing detail page with API endpoints
        document.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const listingId = urlParams.get('id');
            
            if (!listingId) {
                alert('Invalid listing ID');
                window.location.href = '/refurbisher-listings/';
                return;
            }
            
            const apiUrls = {
                listings: "{% url 'listings-list' %}",
                productModelAttributes: "{% url 'product-model-attributes-list' %}",
                userDetail: "{% url 'user-detail-api-list' %}"
            };
            const csrfToken = "{{ csrf_token }}";
            
            initListingDetail(listingId, apiUrls, csrfToken);
        });
    </script>
</body>

</html>
