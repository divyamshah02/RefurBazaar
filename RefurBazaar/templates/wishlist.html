<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Wishlist - Recarvit</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="/static/css/homepage/styles.css">
    <link href="/static/css/shop.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/navbar.css">
    <link rel="stylesheet" href="/static/css/wishlist.css"> </head>

<body class="bg-light">

    {% include 'navbar.html' %}

    <div class="wishlist-header mb-5">
        <div class="container">
            <h1 class="fw-bold text-dark display-5 mb-2">My Wishlist</h1>
            <p class="text-muted fs-5">Saved items you are keeping an eye on.</p>
        </div>
    </div>

    <div class="container pb-5 mb-5 min-vh-50">
        
        <div id="wishlistLoader" class="text-center py-5">
            <div class="spinner-border text-success" role="status" style="width: 3rem; height: 3rem;">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>

        <div class="row g-4" id="wishlistGrid" style="display: none;">
            </div>

        <div class="empty-wishlist" id="emptyWishlistState" style="display: none;">
            <div class="empty-icon-circle mb-4">
                <i class="fas fa-heart text-danger"></i>
            </div>
            <h3 class="fw-bold text-dark">Your wishlist is empty</h3>
            <p class="text-muted mb-4">Looks like you haven't saved any devices yet.</p>
            <a href="{% url 'shop-list' %}" class="btn btn-primary rounded-pill px-4 py-2" style="background: #2A8C3C; border: none; font-weight: 600;">Start Shopping</a>
        </div>

    </div>

    {% include 'footer.html' %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Pass Django variables to JS
        const CSRF_TOKEN = "{{ csrf_token }}";
        const SHOP_URL = "{% url 'shop-list' %}";
    </script>
    <script src="/static/js/api_caller.js"></script>
    <script src="/static/js/wishlist.js"></script> </body>
</html>
