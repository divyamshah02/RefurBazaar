<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Detail - RefurBazar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg main-navbar" id="navbar">
        <div class="container-fluid px-4">
            <a class="navbar-brand" href="/">
                <i class="fas fa-recycle me-2"></i>RefurBazar
            </a>
            
            <div class="d-flex align-items-center ms-auto">
                <a href="/cart/" class="nav-icon me-3" id="cartBtn"><i class="fas fa-shopping-cart"></i><span class="badge" id="cartCount">0</span></a>
                <a href="/account/" class="btn btn-primary">My Account</a>
            </div>
        </div>
    </nav>

    <!-- Breadcrumb -->
    <div class="px-4 py-3" style="margin-top: 100px;">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/">Home</a></li>
                <li class="breadcrumb-item"><a href="/account/">My Account</a></li>
                <li class="breadcrumb-item active">Order Details</li>
            </ol>
        </nav>
    </div>

    <!-- Order Detail Content -->
    <div class="px-4 pb-5">
        <!-- Order Header -->
        <div class="card border-0 shadow-sm mb-4" style="border-radius: 20px;">
            <div class="card-body p-4">
                <div class="row align-items-center">
                    <div class="col-md-6">
                        <h3 class="mb-2">Order #<span id="order-id">Loading...</span></h3>
                        <p class="text-muted mb-0">Placed on <span id="order-date">-</span></p>
                    </div>
                    <div class="col-md-6 text-md-end">
                        <span class="badge fs-5 px-4 py-2" id="order-status-badge" style="border-radius: 50px;">Loading...</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="row g-4">
            <!-- Order Items -->
            <div class="col-lg-8">
                <div class="card border-0 shadow-sm mb-4" style="border-radius: 20px;">
                    <div class="card-header bg-white border-bottom-0 p-4">
                        <h5 class="mb-0"><i class="fas fa-box me-2" style="color: var(--primary-color);"></i>Order Items</h5>
                    </div>
                    <div class="card-body p-4">
                        <div id="order-items-container">
                            <!-- Items populated by JS -->
                        </div>
                    </div>
                </div>

                <!-- Shipping Address -->
                <div class="card border-0 shadow-sm" style="border-radius: 20px;">
                    <div class="card-header bg-white border-bottom-0 p-4">
                        <h5 class="mb-0"><i class="fas fa-map-marker-alt me-2" style="color: var(--primary-color);"></i>Shipping Address</h5>
                    </div>
                    <div class="card-body p-4">
                        <div id="shipping-address">
                            <!-- Address populated by JS -->
                        </div>
                    </div>
                </div>
            </div>

            <!-- Order Summary & Actions -->
            <div class="col-lg-4">
                <!-- Order Summary -->
                <div class="card border-0 shadow-sm mb-4" style="border-radius: 20px;">
                    <div class="card-header bg-white border-bottom-0 p-4">
                        <h5 class="mb-0"><i class="fas fa-receipt me-2" style="color: var(--primary-color);"></i>Order Summary</h5>
                    </div>
                    <div class="card-body p-4">
                        <div class="d-flex justify-content-between mb-3">
                            <span>Subtotal</span>
                            <strong id="summary-subtotal">₹0</strong>
                        </div>
                        <div class="d-flex justify-content-between mb-3">
                            <span>Delivery Charge</span>
                            <strong id="summary-delivery">₹0</strong>
                        </div>
                        <div class="d-flex justify-content-between mb-3">
                            <span>Tax</span>
                            <strong id="summary-tax">₹0</strong>
                        </div>
                        <hr>
                        <div class="d-flex justify-content-between">
                            <strong>Total</strong>
                            <strong style="color: var(--primary-color); font-size: 1.25rem;" id="summary-total">₹0</strong>
                        </div>
                    </div>
                </div>

                <!-- Payment Info -->
                <div class="card border-0 shadow-sm mb-4" style="border-radius: 20px;">
                    <div class="card-header bg-white border-bottom-0 p-4">
                        <h5 class="mb-0"><i class="fas fa-credit-card me-2" style="color: var(--primary-color);"></i>Payment Details</h5>
                    </div>
                    <div class="card-body p-4">
                        <div class="d-flex justify-content-between mb-3">
                            <span>Payment Method</span>
                            <strong id="payment-method">-</strong>
                        </div>
                        <div class="d-flex justify-content-between mb-3">
                            <span>Payment Status</span>
                            <span class="badge" id="payment-status-badge">-</span>
                        </div>
                        <div class="d-flex justify-content-between">
                            <span>Total Amount</span>
                            <strong id="total-amount">₹0</strong>
                        </div>
                    </div>
                </div>

                <!-- Actions -->
                <div class="d-grid gap-2">
                    <button class="btn btn-outline-primary" id="download-invoice-btn">
                        <i class="fas fa-download me-2"></i>Download Invoice
                    </button>
                    <a href="/account/" class="btn btn-primary">
                        <i class="fas fa-arrow-left me-2"></i>Back to Orders
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/api_caller.js"></script>
    <script src="/static/js/order-detail.js"></script>
    
    <script>
        const csrfToken = "{{ csrf_token }}";
        const urlParams = new URLSearchParams(window.location.search);
        const orderId = urlParams.get("order_id");
        
        InitializeOrderDetail(
            csrfToken,
            orderId,
            "/order-api/" + orderId + "/detail/"
        );
    </script>

    <style>
        .order-item {
            padding: 1.5rem;
            border-bottom: 1px solid #e2e8f0;
        }
        
        .order-item:last-child {
            border-bottom: none;
        }
        
        .product-image {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 12px;
        }
    </style>

</body>
</html>
