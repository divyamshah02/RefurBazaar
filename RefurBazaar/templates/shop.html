                            </div>
                        </div>

                        <!-- Brand Filter -->

                        <!-- Price Range Filter -->
                        <div class="filter-section">

                            <div class="price-display-box">

                                    <span class="price-label">From</span>
                                    <span class="price-amount">₹<span id="minPriceDisplay">0</span></span>
                                </div>
                                <div class="price-separator">to</div>
                                <div class="price-value">
                                    <span class="price-label">To</span>
                                    <span class="price-amount">₹<span id="maxPriceDisplay">250000</span></span>
                                </div>
                            </div>

                            <!-- Hidden inputs for API calls -->
                            <input type="hidden" id="minPrice" value="0">
                            <input type="hidden" id="maxPrice" value="250000">

                            <!-- Range Sliders -->
                            <div class="range-slider-container">
                                <input type="range" id="minPriceRange" min="0" max="250000" step="1000" value="0"

                                <input type="range" id="maxPriceRange" min="0" max="250000" step="1000" value="250000"

                            </div>

                            <!-- Quick Price Suggestions -->
                            <div class="price-suggestions mt-3" style="display: none;">

                                <button class="price-btn" onclick="setPriceRange(25000, 50000)">₹25K - ₹50K</button>
                                <button class="price-btn" onclick="setPriceRange(50000, 250000)">₹50K - ₹1L</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Products Grid -->
                <div class="col-lg-10 col-md-9">
                    <div class="products-header">
                        <div class="results-info">
                            <h4 id="categoryTitle">Smartphones</h4>
                            <p class="text-muted" id="resultsCount">Loading...</p>
                        </div>
                        <div class="sort-options">
                            <select class="form-select" id="sortBy">
                                <option value="featured">Featured</option>
                                <option value="price_low">Price: Low to High</option>
                                <option value="price_high">Price: High to Low</option>
                                <option value="newest">Newest First</option>
                            </select>
                            <div class="view-toggle">
                                <button class="btn btn-outline-secondary btn-sm active" onclick="setGridView()">

                                </button>
                                <button class="btn btn-outline-secondary btn-sm" onclick="setListView()">

                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Products grid with dynamic content -->
                    <div class="product-grid" id="productsGrid">
                        <div class="row products-grid" id="productsContainer">
                            <!-- Products will be dynamically populated here -->
                            <div class="col-12 text-center py-5">
                                <div class="spinner-border text-primary" role="status">
                                    <span class="visually-hidden">Loading...</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Empty state message -->

    <!-- Bootstrap Bundle with Popper -->

    <script>
        window.onload = async function () {
            await initShop("{% url 'products-shop' %}", "{{csrf_token}}")
        }
    </script>

    <script>
        const minRange = document.getElementById("minPriceRange");
        const maxRange = document.getElementById("maxPriceRange");

        const minInput = document.getElementById("minPrice");
        const maxInput = document.getElementById("maxPrice");

        const minDisplay = document.getElementById("minPriceDisplay");
        const maxDisplay = document.getElementById("maxPriceDisplay");

        function syncPriceRange() {
            let min = parseInt(minRange.value);
            let max = parseInt(maxRange.value);

            // Hard constraint: min can never exceed max
            if (min > max) {
                if (event.target === minRange) {
                    minRange.value = max;
                    min = max;
                } else {
                    maxRange.value = min;
                    max = min;
                }
            }

            // Single source of truth (USE THESE FOR API)
            minInput.value = min;
            maxInput.value = max;

            // UI display
            minDisplay.textContent = min.toLocaleString("en-IN");
            maxDisplay.textContent = max.toLocaleString("en-IN");
        }

        minRange.addEventListener("input", syncPriceRange);
        maxRange.addEventListener("input", syncPriceRange);

        // Init
        syncPriceRange();
    </script>
