{% if partner %}
<section class="partner-cta-section">
    <div class="container-fluid px-3 px-lg-5">
        <div class="partner-banner-content d-flex flex-column flex-md-row align-items-center justify-content-between">
            <div class="text-center text-md-start mb-4 mb-md-0">
                <h3 class="fw-bold text-white mb-1"><i class="fas fa-handshake me-2 text-warning"></i>{{ partner.heading }}</h3>
                <p class="text-white mb-0">{{ partner.subtext }}</p>
            </div>
            <a href="{{ partner.btn_url }}" class="btn btn-light rounded-pill px-5 py-3 fw-bold shadow-sm text-nowrap">{{ partner.btn_text }} <i class="fas fa-arrow-right ms-2"></i></a>
        </div>
    </div>
</section>
{% endif %}
