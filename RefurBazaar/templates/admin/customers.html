<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customers - Admin Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .sidebar {
            min-height: 100vh;
            background: #2c3e50;
            color: white;
        }
        .sidebar .nav-link {
            color: rgba(255,255,255,0.8);
            padding: 12px 20px;
            margin: 4px 0;
            border-radius: 8px;
            transition: all 0.3s;
        }
        .sidebar .nav-link:hover {
            background: rgba(255,255,255,0.1);
            color: white;
        }
        .sidebar .nav-link.active {
            background: #6bb044;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-2 sidebar p-0">
                <div class="p-4">
                    <h4 class="mb-4"><i class="fas fa-shield-alt me-2"></i>Admin Panel</h4>
                    <nav class="nav flex-column">
                        <a class="nav-link" href="/admin-dashboard/"><i class="fas fa-home me-2"></i>Dashboard</a>
                        <a class="nav-link" href="/admin-orders/"><i class="fas fa-shopping-bag me-2"></i>Orders</a>
                        <a class="nav-link" href="/admin-refurbishers/"><i class="fas fa-users me-2"></i>Refurbishers</a>
                        <a class="nav-link" href="/admin-pending-refurbishers/"><i class="fas fa-clock me-2"></i>Pending Approvals</a>
                        <a class="nav-link active" href="/admin-customers/"><i class="fas fa-user-friends me-2"></i>Customers</a>
                    </nav>
                </div>
            </div>

            <!-- Main Content -->
            <div class="col-md-10 p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2>All Customers</h2>
                    <button class="btn btn-outline-secondary" onclick="location.reload()"><i class="fas fa-sync-alt me-2"></i>Refresh</button>
                </div>

                <!-- Search -->
                <div class="card shadow-sm mb-4">
                    <div class="card-body">
                        <div class="row g-3">
                            <div class="col-md-10">
                                <input type="text" id="searchInput" class="form-control" placeholder="Search by name, email, phone...">
                            </div>
                            <div class="col-md-2">
                                <button class="btn btn-primary w-100" onclick="applySearch()"><i class="fas fa-search me-2"></i>Search</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Customers Table -->
                <div class="card shadow-sm">
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead>
                                    <tr>
                                        <th>User ID</th>
                                        <th>Name</th>
                                        <th>Email</th>
                                        <th>Contact</th>
                                        <th>Total Orders</th>
                                        <th>Total Spent</th>
                                        <th>Registered On</th>
                                        <th>Status</th>
                                    </tr>
                                </thead>
                                <tbody id="customersTable">
                                    <tr>
                                        <td colspan="8" class="text-center"><i class="fas fa-spinner fa-spin me-2"></i>Loading customers...</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/api_caller.js"></script>
    <script src="/static/js/admin/customers.js"></script>
    <script>
        const csrfToken_p = '{{ csrf_token }}';
        const customersApiUrl_p = '/admin-api/dashboard/customers/';
        
        InitializeAdminCustomers(csrfToken_p, customersApiUrl_p);
    </script>
</body>
</html>
