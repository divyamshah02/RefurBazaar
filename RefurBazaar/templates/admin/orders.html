<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Orders - Admin - RefurBazaar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
</head>
<body>
    <!-- Admin Sidebar -->
    <div class="d-flex" id="wrapper">
        <!-- Sidebar -->
        <div class="bg-dark" id="sidebar-wrapper" style="min-height: 100vh; width: 250px;">
            <div class="sidebar-heading text-white p-4 border-bottom border-secondary">
                <h4 class="mb-0"><i class="fas fa-shield-alt me-2"></i>Admin Panel</h4>
            </div>
            <div class="list-group list-group-flush">
                <a href="/admin-dashboard/" class="list-group-item list-group-item-action bg-dark text-white border-secondary">
                    <i class="fas fa-chart-line me-2"></i>Dashboard
                </a>
                <a href="/admin-orders/" class="list-group-item list-group-item-action bg-dark text-white border-secondary active">
                    <i class="fas fa-shopping-cart me-2"></i>Orders
                </a>
                <a href="/admin-refurbishers/" class="list-group-item list-group-item-action bg-dark text-white border-secondary">
                    <i class="fas fa-store me-2"></i>Refurbishers
                </a>
                <a href="/admin-pending-refurbishers/" class="list-group-item list-group-item-action bg-dark text-white border-secondary">
                    <i class="fas fa-clock me-2"></i>Pending Approvals
                </a>
                <a href="/admin-customers/" class="list-group-item list-group-item-action bg-dark text-white border-secondary">
                    <i class="fas fa-users me-2"></i>Customers
                </a>
            </div>
        </div>

        <!-- Page Content -->
        <div id="page-content-wrapper" style="flex: 1;">
            <!-- Top Navigation -->
            <nav class="navbar navbar-expand-lg navbar-light bg-light border-bottom">
                <div class="container-fluid">
                    <h5 class="mb-0">All Orders</h5>
                    <div class="d-flex align-items-center">
                        <span class="me-3">Admin</span>
                        <button class="btn btn-outline-danger btn-sm" onclick="logout()">
                            <i class="fas fa-sign-out-alt"></i> Logout
                        </button>
                    </div>
                </div>
            </nav>

            <!-- Main Content -->
            <div class="container-fluid p-4">
                <!-- Filters -->
                <div class="card border-0 shadow-sm mb-4">
                    <div class="card-body">
                        <div class="row g-3">
                            <div class="col-md-4">
                                <input type="text" id="searchInput" class="form-control" placeholder="Search by Order ID, Customer...">
                            </div>
                            <div class="col-md-3">
                                <select id="statusFilter" class="form-select">
                                    <option value="">All Status</option>
                                    <option value="pending">Pending</option>
                                    <option value="processing">Processing</option>
                                    <option value="shipped">Shipped</option>
                                    <option value="delivered">Delivered</option>
                                    <option value="cancelled">Cancelled</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <select id="paymentFilter" class="form-select">
                                    <option value="">All Payments</option>
                                    <option value="paid">Paid</option>
                                    <option value="pending">Pending</option>
                                    <option value="failed">Failed</option>
                                </select>
                            </div>
                            <div class="col-md-2">
                                <button class="btn btn-primary w-100" onclick="applyFilters()">
                                    <i class="fas fa-filter me-2"></i>Filter
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Orders Table -->
                <div class="card border-0 shadow-sm">
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead>
                                    <tr>
                                        <th>Order ID</th>
                                        <th>Customer</th>
                                        <th>Contact</th>
                                        <th>Items</th>
                                        <th>Amount</th>
                                        <th>Payment</th>
                                        <th>Status</th>
                                        <th>Date</th>
                                        <th>Action</th>
                                    </tr>
                                </thead>
                                <tbody id="ordersTable">
                                    <tr>
                                        <td colspan="9" class="text-center text-muted">
                                            <i class="fas fa-spinner fa-spin me-2"></i>Loading orders...
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/api_caller.js"></script>
    <script src="/static/js/admin/orders.js"></script>
    <script>
        const csrfToken_p = '{{ csrf_token }}';
        const ordersUrl_p = '/admin-api/dashboard/orders/';
        
        InitializeAdminOrders(csrfToken_p, ordersUrl_p);
    </script>
</body>
</html>
