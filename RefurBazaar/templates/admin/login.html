{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login — RefurBazaar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    :root {
      --sb-bg: #0f1117;
      --sb-border: #1e2130;
      --sb-text: #8b90a0;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --red: #ef4444;
      --red-bg: #fef2f2;
      --red-text: #7f1d1d;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 14px; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--sb-bg);
      color: #e2e4ea;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background-image:
        radial-gradient(circle at 15% 20%, rgba(59,130,246,0.12) 0%, transparent 45%),
        radial-gradient(circle at 85% 80%, rgba(59,130,246,0.08) 0%, transparent 45%);
    }
    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; cursor: pointer; }
    input { font-family: inherit; }

    .card {
      width: 100%;
      max-width: 380px;
      background: #151822;
      border: 1px solid var(--sb-border);
      border-radius: var(--radius-lg);
      padding: 36px 32px 32px;
      box-shadow: 0 20px 50px rgba(0,0,0,.5);
    }
    .logo {
      width: 44px; height: 44px; border-radius: var(--radius-sm);
      background: var(--accent);
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 20px;
    }
    .logo i { color: #fff; font-size: 19px; }
    h1 { font-size: 19px; font-weight: 700; color: #fff; margin-bottom: 4px; letter-spacing: -.2px; }
    .sub { font-size: 13px; color: var(--sb-text); margin-bottom: 28px; }

    .field { margin-bottom: 16px; }
    label { display: block; font-size: 12px; font-weight: 600; color: var(--sb-text); margin-bottom: 6px; letter-spacing: .2px; }
    .input-wrap { position: relative; }
    .input-wrap i {
      position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
      color: var(--sb-text); font-size: 13px; pointer-events: none;
    }
    input.field-input {
      width: 100%;
      padding: 10px 12px 10px 36px;
      border: 1px solid var(--sb-border);
      border-radius: var(--radius-sm);
      background: #0f1117;
      color: #e2e4ea;
      font-size: 13.5px;
      outline: none;
      transition: border-color .15s;
    }
    input.field-input::placeholder { color: #555b70; }
    input.field-input:focus { border-color: var(--accent); }
    .toggle-pass {
      position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
      background: none; border: none; color: var(--sb-text); font-size: 13px;
      padding: 4px;
    }
    .toggle-pass:hover { color: #e2e4ea; }

    .btn-submit {
      width: 100%;
      padding: 11px 0;
      border: none; border-radius: var(--radius-sm);
      background: var(--accent); color: #fff;
      font-size: 13.5px; font-weight: 600;
      margin-top: 6px;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: background .15s, opacity .15s;
    }
    .btn-submit:hover:not(:disabled) { background: var(--accent-hover); }
    .btn-submit:disabled { opacity: .6; cursor: not-allowed; }

    .error-box {
      display: none;
      align-items: center; gap: 8px;
      background: var(--red-bg);
      color: var(--red-text);
      border: 1px solid rgba(239,68,68,.25);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      font-size: 12.5px;
      margin-bottom: 16px;
    }
    .error-box.show { display: flex; }
    .error-box i { font-size: 13px; flex-shrink: 0; }

    .spin {
      width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,.35);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      display: none;
    }
    .btn-submit.loading .spin { display: inline-block; }
    .btn-submit.loading .btn-label { opacity: .8; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .footer-note {
      text-align: center;
      margin-top: 24px;
      font-size: 11.5px;
      color: #555b70;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .footer-note i { color: #10b981; font-size: 11px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo"><i class="fa-solid fa-recycle"></i></div>
    <h1>RefurBazaar Admin</h1>
    <div class="sub">Sign in with your admin credentials</div>

    <div class="error-box" id="err-box">
      <i class="fa-solid fa-circle-exclamation"></i>
      <span id="err-text"></span>
    </div>

    <form id="login-form">
      <div class="field">
        <label for="contact_number">Mobile Number</label>
        <div class="input-wrap">
          <i class="fa-solid fa-phone"></i>
          <input type="tel" class="field-input" id="contact_number" placeholder="Enter your mobile number" autocomplete="username" required />
        </div>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <div class="input-wrap">
          <i class="fa-solid fa-lock"></i>
          <input type="password" class="field-input" id="password" placeholder="Enter your password" autocomplete="current-password" style="padding-right:36px" required />
          <button type="button" class="toggle-pass" id="toggle-pass" tabindex="-1"><i class="fa-solid fa-eye"></i></button>
        </div>
      </div>
      <button type="submit" class="btn-submit" id="submit-btn">
        <span class="spin"></span>
        <span class="btn-label">Sign In</span>
      </button>
    </form>

    <div class="footer-note"><i class="fa-solid fa-shield-halved"></i> Restricted access — Admins only</div>
  </div>

  <script src="{% static 'js/api_caller.js' %}"></script>
  <script>
    const togglePass = document.getElementById('toggle-pass');
    const passInput = document.getElementById('password');
    togglePass.addEventListener('click', () => {
      const isText = passInput.type === 'text';
      passInput.type = isText ? 'password' : 'text';
      togglePass.innerHTML = isText ? '<i class="fa-solid fa-eye"></i>' : '<i class="fa-solid fa-eye-slash"></i>';
    });

    function showError(msg) {
      const box = document.getElementById('err-box');
      document.getElementById('err-text').textContent = msg;
      box.classList.add('show');
    }
    function hideError() {
      document.getElementById('err-box').classList.remove('show');
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError();

      const contact_number = document.getElementById('contact_number').value.trim();
      const password = document.getElementById('password').value;
      if (!contact_number || !password) { showError('Please enter your mobile number and password.'); return; }

      const btn = document.getElementById('submit-btn');
      btn.disabled = true; btn.classList.add('loading');

      const csrf = "{{ csrf_token }}";
      const [ok, res] = await callApi('POST', "{% url 'admin-login-api-list' %}", { contact_number, password }, csrf);

      btn.disabled = false; btn.classList.remove('loading');

      if (!ok) { showError('Something went wrong. Please try again.'); return; }
      if (!res.success) { showError(res.error || 'Login failed.'); return; }
      if (!res.data.login_success) { showError(res.data.message || 'Invalid credentials.'); return; }

      window.location.href = '/admin-dashboard/';
    });
  </script>
</body>
</html>
